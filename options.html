<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open in ThreadReader – Options</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; min-width: 320px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 0 0 12px; padding: 8px 12px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; margin: 4px 0; cursor: pointer; }
    .hint { color: #666; font-size: 12px; margin: 4px 0 0; }
    #status { color: #2a7; font-size: 12px; height: 16px; }
  </style>
</head>
<body>
  <h1>Open in ThreadReader</h1>

  <fieldset>
    <legend>Open ThreadReader pages in</legend>
    <label><input type="radio" name="openIn" value="tab"> a new tab</label>
    <label><input type="radio" name="openIn" value="window"> a new window</label>
  </fieldset>

  <fieldset>
    <legend>Shortcut</legend>
    <label><input type="checkbox" id="altClick"> Option-click (Alt-click) a tweet link opens it in ThreadReader</label>
    <p class="hint">Right-click → "Open in ThreadReader" always works regardless of this setting.</p>
  </fieldset>

  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
